# `doc_markdown` reads a CamelCase word in a doc comment as an unlinked item and
# asks for backticks. These are not items — they are the names Qwen gives its
# checkpoint families and its tokenizer, and this backend's documentation is
# mostly about telling them apart, or the names of products such as ROCm.
# Backticking them would make prose about a product read like prose about a
# type.
#
# The list extends clippy's own defaults rather than replacing them.
doc-valid-idents = ["CustomVoice", "VoiceDesign", "CubeCL", "ROCm", ".."]
