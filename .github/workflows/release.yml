name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # `kernels/autotune.bundle` only works with the CubeCL it was exported
  # from: the version is part of every namespace in it, and CubeCL imports a
  # bundle from another version with a warning and then never looks its
  # entries up. So a CubeCL bump without a re-export would ship a bundle that
  # does nothing, and every user would pay the full cold load. This fails the
  # release first. It cannot see a change in the shapes the model runs under
  # the same CubeCL; re-export after those too.
  kernel-bundle:
    name: Kernel bundle matches CubeCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare the bundle's CubeCL with Cargo.lock's
        run: |
          python3 - <<'EOF'
          import collections, json, sqlite3, sys, tomllib

          lock = tomllib.load(open("Cargo.lock", "rb"))
          versions = {p["version"] for p in lock["package"] if p["name"] == "cubecl-environment"}
          if len(versions) != 1:
              sys.exit(f"::error file=Cargo.lock::expected one cubecl-environment in Cargo.lock, found {sorted(versions)}")
          (want,) = versions

          db = sqlite3.connect("file:kernels/autotune.bundle?mode=ro", uri=True)
          manifest = json.loads(db.execute("select v from meta where k = 'manifest'").fetchone()[0])
          counts = collections.Counter()
          stale = collections.Counter()
          for namespace, n in db.execute("select namespace, count(*) from entries group by namespace"):
              kind, version, device, *_ = namespace.split("/")
              counts[f"{kind} {device}"] += n
              if version != want:
                  stale[version] += n

          print(f"bundle {manifest['name']!r}, exported for CubeCL {manifest['cubecl_version']}; Cargo.lock has {want}")
          for what, n in sorted(counts.items()):
              print(f"  {n:4} {what}")

          if manifest["cubecl_version"] != want or stale:
              sys.exit(
                  "::error file=kernels/autotune.bundle::kernels/autotune.bundle was exported for CubeCL "
                  f"{manifest['cubecl_version']} ({dict(stale) or 'every namespace'}), but this build links {want}. "
                  "CubeCL ignores entries from another version, so the release would ship a bundle that does "
                  "nothing. Re-export it with this build (README, \"Shipping a warm cache\")."
              )
          EOF

  build:
    name: Build ${{ matrix.target }} ${{ matrix.suffix }}
    needs: kernel-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per (target, accelerator). CubeCL compiles kernels at
          # runtime, so there is no compute-capability axis: what used to be
          # twelve CUDA builds is two, one per CUDA major version.
          #
          # `features` is passed with `--no-default-features`, so each build
          # carries exactly one backend rather than its own plus the default
          # `flex`.
          #
          # Every Linux build links against Ubuntu 22.04's glibc, 2.35, so
          # every asset starts on the same hosts. A build with an `image` runs
          # through cross inside it; the rest build natively on a 22.04 runner.
          # cross's own default images are not an option: since May 2026 they
          # are Ubuntu 24.04, and std's weak reference to `pidfd_spawnp` picks
          # up that glibc's version, so a binary that spawns a process at all
          # demands 2.39 and will not start on 22.04 or Debian 12. macOS
          # builds natively too: cross has no Apple SDK to offer.

          # CPU (x86_64) — the pure-Rust backend, which runs anywhere. Usable,
          # but the talker is a transformer: expect slower than real time.
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              suffix: cpu,
              features: flex,
              image: "",
            }

          # CUDA. Built inside the nvidia/cuda devel image via cross's image
          # override: `cudarc` asks `nvcc --version` which CUDA API to bind, so
          # the image's toolkit is what decides `cuda_major`. The plain `devel`
          # tag, not `cudnn-devel`: Burn never calls cuDNN, and its layers are
          # gigabytes of a runner's disk for nothing.
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              suffix: cuda12,
              features: cuda,
              image: "nvidia/cuda:12.9.1-devel-ubuntu22.04",
            }
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              suffix: cuda13,
              features: cuda,
              image: "nvidia/cuda:13.0.3-devel-ubuntu22.04",
            }

          # ROCm. The image has to carry a ROCm whose HIP version
          # `cubecl-hip-sys` has bindings for: it reads the version from
          # `hipconfig` and links the libraries it finds, so this tag moves
          # with that crate. 7.1.1 is HIP 52802; 7.1.0 reports a patch number
          # the crate has no bindings for.
          #
          # Ubuntu 22.04 rather than 24.04, like the CUDA images: the binary
          # needs the glibc of the image it was linked in, and one linked
          # against 24.04's 2.39 would not start on the 22.04 hosts ROCm 7.1
          # supports.
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              suffix: rocm,
              features: rocm,
              image: "rocm/dev-ubuntu-22.04:7.1.1",
            }

          # No Vulkan build: the backend has none (see the README).

          # CPU (aarch64), built natively on an arm64 runner. No CUDA or ROCm
          # on ARM here.
          - {
              os: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              suffix: cpu,
              features: flex,
              image: "",
            }

          # macOS, Apple Silicon only: macOS 26 is the last release for Intel
          # Macs. The CPU build is the same `flex` as on Linux.
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              suffix: cpu,
              features: flex,
              image: "",
            }

          # Metal. Nothing to install: wgpu reaches Metal through the system
          # framework, and CubeCL compiles its kernels to MSL at runtime, so
          # as with CUDA there is no per-GPU axis.
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              suffix: metal,
              features: metal,
              image: "",
            }

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.suffix }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.image != ''
        run: cargo install cross --git https://github.com/cross-rs/cross

      # The CUDA and ROCm builds run inside their vendor's devel image, which
      # carries the toolkit those backends bind against, selected per-target
      # via cross's image override. Everything else builds with cargo on the
      # runner itself. No GPU is needed at build time and no compute
      # capability is chosen: CubeCL compiles the kernels on the host that
      # runs them.
      #
      # cross runs the container as the runner's uid, which has no passwd
      # entry there, so `HOME` is `/` and nothing under it is writable. The
      # ROCm build needs it to be: `cubecl-hip` compiles through a prebuilt
      # LLVM that `tracel-llvm-bundler`'s build script downloads to
      # `~/.cache/tracel` and unpacks to `~/.local/share/tracel`, then links
      # statically. `/tmp` is the container's own and dies with it.
      - name: Build
        run: |
          if [ -n "${{ matrix.image }}" ]; then
            build=cross
            export CROSS_TARGET_X86_64_UNKNOWN_LINUX_GNU_IMAGE="${{ matrix.image }}"
            export CROSS_CONTAINER_OPTS="-e HOME=/tmp/home"
          else
            build=cargo
          fi
          "$build" build --release --locked --target ${{ matrix.target }} \
            --no-default-features --features "${{ matrix.features }}" \
            --bin super-tts-backend-qwen-tts

      # `kernels/` rides along with the binary. It holds the pre-warmed autotune
      # cache, which is the slow half of a first load — about four minutes on an
      # RTX 3090, against under one for the compiling alone. Under a megabyte,
      # and every namespace in it carries a device fingerprint, so the entries a
      # machine cannot use are never looked up: one file covers every GPU it was
      # warmed on and costs the others nothing. Shipped in every tarball,
      # including the CPU one, rather than matched per accelerator.
      #
      # `COPYFILE_DISABLE` stops macOS's bsdtar adding an AppleDouble `._`
      # entry for any file carrying extended attributes. GNU tar ignores it.
      - name: Create tarball
        env:
          COPYFILE_DISABLE: "1"
        run: |
          tar -czf "qwen-tts-${{ matrix.target }}-${{ matrix.suffix }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" super-tts-backend-qwen-tts \
            -C "$GITHUB_WORKSPACE" kernels
          ls -lh qwen-tts-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: qwen-tts-${{ matrix.target }}-${{ matrix.suffix }}
          path: qwen-tts-${{ matrix.target }}-${{ matrix.suffix }}.tar.gz

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # backend.toml must ship as a release asset named exactly `backend.toml`:
      # the super-tts indexer hashes these bytes into the registry's `manifest`
      # pin, and the daemon verifies the installed manifest against that hash
      # (reviewed == pinned == installed). Without it, the indexer falls back to
      # un-pinned repo-source indexing. Checkout brings the tag's backend.toml
      # into the workspace — the build tarballs don't carry it.
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backend.toml
            artifacts/**/*.tar.gz
          generate_release_notes: true
