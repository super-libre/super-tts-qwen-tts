# ---------------------------------------------------------------------------
# The 1.7B VoiceDesign checkpoint: no speakers at all. The voice is written out
# in words and the model builds it, which is the `described` voice kind.
# ---------------------------------------------------------------------------

[[models]]
    name = "qwen3-tts-1.7b-voice-design"
    multilingual = true
    primary_language = "en"
    supported_languages = ["de", "en", "es", "fr", "it", "ja", "ko", "pt", "ru", "zh"]
    supported_devices = ["cpu", "gpu"]
    estimated_vram_bytes = 6442450944
    max_input_chars = 500
    output_sample_rate = 24000
    # Described only, so there are no `[[models.voices]]` and no `default_voice`
    # to name. A voice id is `desc:` followed by the description, e.g.
    # `desc:A calm, deep male voice speaking slowly.` A request that names no
    # voice — which is every request the settings app sends, since its voice
    # picker has no `[[models.voices]]` here to offer — gets the voice the two
    # `[[options]]` at the top of this file are set to, and the neutral
    # description in src/voices.rs when they are set to nothing. A prompt with no
    # instruction at all leaves the voice to the sampler, and it would then
    # differ from one request to the next.
    voice_kinds = ["described"]
    files = [
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign/resolve/main/config.json", destination = "models/qwen3-tts-1.7b-voice-design/config.json", sha256 = "aecd2cc4c1fe9edef1cb7ca7c401685a43879ad43f3f9e883f1c6760b61731e0" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign/resolve/main/model.safetensors", destination = "models/qwen3-tts-1.7b-voice-design/model.safetensors", sha256 = "391e8db219f292c515297cdceeb43e4eae67cdde35fa57e79a6a8a532fca0522" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign/resolve/main/speech_tokenizer/config.json", destination = "models/qwen3-tts-1.7b-voice-design/speech_tokenizer/config.json", sha256 = "ee65bb901c876664ab8707c487157aa1a6ee57c65969b28fb5ec9dc211e68167" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign/resolve/main/speech_tokenizer/model.safetensors", destination = "models/qwen3-tts-1.7b-voice-design/speech_tokenizer/model.safetensors", sha256 = "836b7b357f5ea43e889936a3709af68dfe3751881acefe4ecf0dbd30ba571258" },
        { url = "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/tokenizer.json", destination = "models/qwen3-tts-1.7b-voice-design/tokenizer.json", sha256 = "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4" },
    ]

# The Base checkpoints, which are the family that clones. They have no speakers
# of their own and take no description: a request names a voice the user cloned,
# and the daemon has pushed its reference recording over `POST /v1/voices`
# before the first synthesis that names it. A Base checkpoint asked for no voice
# at all speaks in whatever voice the sampler wanders into, which is why there
# is no `default_voice` here — the backend refuses instead.
#
# `clone_needs_transcript` is deliberately unset. Both ways of cloning are
# implemented: the speaker embedding alone, and, when the stored voice has a
# transcript, that recording fed back as an in-context example the way the
# reference implementation does it. Setting the flag would make the daemon
# refuse a clip stored without words, which is a voice this backend can serve.
[[models]]
    name = "qwen3-tts-0.6b-base"
    multilingual = true
    primary_language = "en"
    supported_languages = ["de", "en", "es", "fr", "it", "ja", "ko", "pt", "ru", "zh"]
    supported_devices = ["cpu", "gpu"]
    # Same weights as the CustomVoice checkpoint of this size, plus the codec's
    # encoder and the speaker encoder — both small next to the talker.
    estimated_vram_bytes = 3758096384
    max_input_chars = 500
    output_sample_rate = 24000
    # Fifteen seconds of reference audio. Long enough for a speaker embedding to
    # settle, and short enough that the in-context example it also becomes — 188
    # codec frames — does not crowd the prefix of every sentence that follows.
    voice_kinds = ["cloned"]
    clone_ref_seconds = 15.0
    files = [
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base/resolve/main/config.json", destination = "models/qwen3-tts-0.6b-base/config.json", sha256 = "2e714c787c8edb98b05432685cddb634add2de4d4e645f653d68251ef72ba011" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base/resolve/main/model.safetensors", destination = "models/qwen3-tts-0.6b-base/model.safetensors", sha256 = "180b3b10eb1c9f1b4db7806d5475bae3071c0243c299d49926bab1da3b6946f6" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base/resolve/main/speech_tokenizer/config.json", destination = "models/qwen3-tts-0.6b-base/speech_tokenizer/config.json", sha256 = "ee65bb901c876664ab8707c487157aa1a6ee57c65969b28fb5ec9dc211e68167" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-Base/resolve/main/speech_tokenizer/model.safetensors", destination = "models/qwen3-tts-0.6b-base/speech_tokenizer/model.safetensors", sha256 = "836b7b357f5ea43e889936a3709af68dfe3751881acefe4ecf0dbd30ba571258" },
        { url = "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/tokenizer.json", destination = "models/qwen3-tts-0.6b-base/tokenizer.json", sha256 = "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4" },
    ]

[[models]]
    name = "qwen3-tts-1.7b-base"
    multilingual = true
    primary_language = "en"
    supported_languages = ["de", "en", "es", "fr", "it", "ja", "ko", "pt", "ru", "zh"]
    supported_devices = ["cpu", "gpu"]
    # 3.8 GB of weights plus the 0.7 GB codec, in bf16, with KV-cache headroom.
    estimated_vram_bytes = 6442450944
    max_input_chars = 500
    output_sample_rate = 24000
    voice_kinds = ["cloned"]
    clone_ref_seconds = 15.0
    files = [
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base/resolve/main/config.json", destination = "models/qwen3-tts-1.7b-base/config.json", sha256 = "b4f01752d15a488abde3e1ab44723ae4f4b9e68a4037257b098b3737893cc1f9" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base/resolve/main/model.safetensors", destination = "models/qwen3-tts-1.7b-base/model.safetensors", sha256 = "38fc7fc51c5e776e840414b6fd443962e9411b9654888fd7913e4da643cb857c" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base/resolve/main/speech_tokenizer/config.json", destination = "models/qwen3-tts-1.7b-base/speech_tokenizer/config.json", sha256 = "ee65bb901c876664ab8707c487157aa1a6ee57c65969b28fb5ec9dc211e68167" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base/resolve/main/speech_tokenizer/model.safetensors", destination = "models/qwen3-tts-1.7b-base/speech_tokenizer/model.safetensors", sha256 = "836b7b357f5ea43e889936a3709af68dfe3751881acefe4ecf0dbd30ba571258" },
        { url = "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/tokenizer.json", destination = "models/qwen3-tts-1.7b-base/tokenizer.json", sha256 = "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4" },
    ]
