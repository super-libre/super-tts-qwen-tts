#:schema https://jorge-menjivar.github.io/super-tts/backend.schema.json
# Qwen text-to-speech for Super TTS.
#
# The backend is named for the family, the models for their generation: a later
# generation joins the `[[models]]` list below rather than forking the repo, and
# the two then coexist under one installed backend.
#
# Every file below is fetched by the daemon before the first `POST /v1/load`:
# the backend runs with `PrivateNetwork=yes` and a read-only backend directory,
# so it can neither download nor write a weight itself. Only the selected
# model's files are fetched, so declaring three models costs a user nothing
# beyond the one they load.

[backend]
    id = "app.super-tts.qwen-tts"
    source = "github.com/super-libre/super-tts-qwen-tts"
    name = "Qwen TTS"
    version = "0.1.0"
    kind = "subprocess"
    entrypoint = "super-tts-backend-qwen-tts"
    contract = "v1"
    license = "GPL-3.0-only"
    description = "Qwen local text-to-speech, 24 kHz, 10 languages. Serves the Qwen3-TTS checkpoints: nine preset voices, or a voice built from a description."

[network]
    # Required to be empty for subprocess backends; the transport has no network.
    allowed_hosts = []

# The one option this backend declares: the wording behind the VoiceDesign
# checkpoint's `custom` voice.
#
# Which voice a model speaks in is not an option — it is a voice id, declared
# per model under `[[models.voices]]` and stored per model by the daemon, which
# validates a pick against the model that has to resolve it and needs no reload
# to change one. An option is neither: it is one value for the whole backend, so
# every other model here would see a setting it can only ignore, and writing one
# reloads the checkpoint.
#
# What is left is the half a voice list cannot hold. The twelve designs are
# fixed wording and are voices; this is the sentence the user writes, and a
# free-text field is not a picker entry. So `custom` is a declared voice like
# any other and this option is what it stands for — see src/voices.rs.

# Deliberately without `choices`: this is free text, and declaring any would
# turn it into a dropdown and refuse every voice a user wrote. It is the one
# thing about a voice that could not become a `[[models.voices]]` entry, which
# is why it is the one thing still declared here.
[[options]]
    name = "voice_design_description"
    label = "Custom voice description"
    description = "The voice the Voice Design model builds when its voice is set to Custom. Describe it in your own words, e.g. 'A hoarse, weary sailor speaking slowly'; leave it empty to fall back to the default voice. Ignored by the other models, which speak with a preset or a cloned voice."
    type = "string"

[[options]]
    name = "temperature"
    label = "Temperature"
    description = "How freely the model picks each frame of speech. Lower is steadier and more literal, higher is more varied and more willing to pause mid-sentence. It steers delivery and pacing; the codec that turns the chosen frames into sound keeps its own setting either way."
    type = "float"
    default = 0.9
    min = 0.6
    max = 1.2
    step = 0.1

# One entry per tarball `.github/workflows/release.yml` builds — the filenames
# must match it exactly, since the indexer resolves them against the release's
# assets and pins their hashes. The archives hold the binary at their root,
# which is where `entrypoint` above says to find it.
#
# One build per (target, accelerator). There is no compute-capability axis:
# Burn compiles every kernel at runtime through CubeCL — NVRTC on CUDA, hiprtc
# on ROCm, SPIR-V on Vulkan — so one CUDA build serves every NVIDIA generation
# the installed driver can compile for, where an ahead-of-time build needs one
# asset per SM. What is left is the CUDA major version, which decides the API
# the binary was built against.

[[assets.subprocess]]
    file = "qwen-tts-x86_64-unknown-linux-gnu-cpu.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cpu"

[[assets.subprocess]]
    file = "qwen-tts-x86_64-unknown-linux-gnu-cuda12.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 12
    # No `cuda_sm`: the kernels are compiled on the host by NVRTC, so this
    # build matches any compute capability, which is what omitting it declares.

[[assets.subprocess]]
    file = "qwen-tts-x86_64-unknown-linux-gnu-cuda13.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "cuda"
    cuda_major = 13

# AMD. The kernels are compiled at runtime here too, so this list is not the
# set of architectures the binary carries code for — it is the set the backend
# is claimed to work on, which the schema requires to be explicit because an
# ahead-of-time HIP build could not honestly claim more. RDNA2 through RDNA4
# and the CDNA parts; a card outside it will usually work and is simply not
# advertised.
[[assets.subprocess]]
    file = "qwen-tts-x86_64-unknown-linux-gnu-rocm.tar.gz"
    target = "x86_64-unknown-linux-gnu"
    accel = "rocm"
    gfx = [
        "gfx90a",
        "gfx942",
        "gfx1030",
        "gfx1100",
        "gfx1101",
        "gfx1102",
        "gfx1200",
        "gfx1201",
    ]

# No Vulkan asset. The build exists (`just build-vulkan`) but does not run: on
# NVIDIA's 610.57.04 driver every load segfaults inside the driver's SPIR-V
# compiler while it builds a bf16 reduce kernel, and an NVIDIA card without
# CUDA installed is one of the hosts that asset was for. When it comes back,
# its floor is `vulkan_api = "1.2"`: the sampling kernel reduces across a
# plane, and the subgroup types that needs are core in Vulkan 1.2 (CubeCL
# reaches for `VK_KHR_shader_subgroup_extended_types` below it).

[[assets.subprocess]]
    file = "qwen-tts-aarch64-unknown-linux-gnu-cpu.tar.gz"
    target = "aarch64-unknown-linux-gnu"
    accel = "cpu"

# macOS on Apple Silicon. Metal compiles its kernels at runtime like the other
# GPU builds, so it has nothing to select on beyond the target.
[[assets.subprocess]]
    file = "qwen-tts-aarch64-apple-darwin-cpu.tar.gz"
    target = "aarch64-apple-darwin"
    accel = "cpu"

[[assets.subprocess]]
    file = "qwen-tts-aarch64-apple-darwin-metal.tar.gz"
    target = "aarch64-apple-darwin"
    accel = "metal"

# ---------------------------------------------------------------------------
# The 0.6B CustomVoice checkpoint: the default. Nine voices, ten languages, and
# the smallest of the three, which is what makes it the one worth trying on a
# machine with no GPU.
# ---------------------------------------------------------------------------

[[models]]
    name = "qwen3-tts-0.6b-custom-voice"
    multilingual = true
    primary_language = "en"
    # The ten languages the talker's `codec_language_id` table names, as BCP-47
    # codes; src/lang.rs holds the join and a test asserts the two agree. The
    # Beijing and Sichuan dialects are not listed: the reference implementation
    # selects them through the speaker (`dylan`, `eric`), not the language.
    supported_languages = ["de", "en", "es", "fr", "it", "ja", "ko", "pt", "ru", "zh"]
    supported_devices = ["cpu", "gpu"]
    # The weights (1.8 GB) plus the codec (0.7 GB) in bf16, with room for the
    # KV cache of a long utterance. Deliberately conservative: the daemon uses
    # this to decide whether a GPU can hold the model at all.
    estimated_vram_bytes = 3758096384
    # The talker puts the whole text in its prefix and generates until it emits
    # end-of-speech, so a chunk this size is about half a minute of speech —
    # well inside the 164-second cap in src/model.rs.
    max_input_chars = 500
    output_sample_rate = 24000
    default_voice = "ryan"
    # Preset only: this checkpoint conditions on one of its own speakers. It
    # ignores `instructions` — the 0.6B models were not trained on them and the
    # reference implementation drops them.
    voice_kinds = ["preset"]
    files = [
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice/resolve/main/config.json", destination = "models/qwen3-tts-0.6b-custom-voice/config.json", sha256 = "81aca2b6fac304944d8acf345272d8a9a727d5fc2e2e66b222ab4729340c7455" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice/resolve/main/model.safetensors", destination = "models/qwen3-tts-0.6b-custom-voice/model.safetensors", sha256 = "bc3c7e785eb961179c25450d1acff03f839e0002f2f3a5aeb67b5735c0fa2adb" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice/resolve/main/speech_tokenizer/config.json", destination = "models/qwen3-tts-0.6b-custom-voice/speech_tokenizer/config.json", sha256 = "ee65bb901c876664ab8707c487157aa1a6ee57c65969b28fb5ec9dc211e68167" },
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice/resolve/main/speech_tokenizer/model.safetensors", destination = "models/qwen3-tts-0.6b-custom-voice/speech_tokenizer/model.safetensors", sha256 = "836b7b357f5ea43e889936a3709af68dfe3751881acefe4ecf0dbd30ba571258" },
        # The TTS repositories ship `vocab.json` and `merges.txt` but no
        # assembled `tokenizer.json`, and the vocabulary is Qwen3's own — which
        # is why the reference candle example reads it from `Qwen/Qwen3-0.6B`.
        { url = "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/tokenizer.json", destination = "models/qwen3-tts-0.6b-custom-voice/tokenizer.json", sha256 = "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4" },
    ]

    [[models.voices]]
        id = "ryan"
        label = "Ryan (English, male)"
        language = "en"
        tags = ["english", "male", "dynamic"]

    [[models.voices]]
        id = "aiden"
        label = "Aiden (American, male)"
        language = "en"
        tags = ["english", "american", "male"]

    [[models.voices]]
        id = "vivian"
        label = "Vivian (Mandarin, female)"
        language = "zh"
        tags = ["mandarin", "female", "bright"]

    [[models.voices]]
        id = "serena"
        label = "Serena (Mandarin, female)"
        language = "zh"
        tags = ["mandarin", "female", "warm"]

    [[models.voices]]
        id = "uncle_fu"
        label = "Uncle Fu (Mandarin, male)"
        language = "zh"
        tags = ["mandarin", "male", "mellow"]

    [[models.voices]]
        id = "dylan"
        label = "Dylan (Beijing Mandarin, male)"
        language = "zh"
        tags = ["mandarin", "beijing", "male"]

    [[models.voices]]
        id = "eric"
        label = "Eric (Sichuan Mandarin, male)"
        language = "zh"
        tags = ["mandarin", "sichuan", "male"]

    [[models.voices]]
        id = "ono_anna"
        label = "Ono Anna (Japanese, female)"
        language = "ja"
        tags = ["japanese", "female", "playful"]

    [[models.voices]]
        id = "sohee"
        label = "Sohee (Korean, female)"
        language = "ko"
        tags = ["korean", "female", "warm"]

# ---------------------------------------------------------------------------
# The 1.7B CustomVoice checkpoint: the same nine voices, better prosody, and it
# does read `instructions`.
# ---------------------------------------------------------------------------

[[models]]
    name = "qwen3-tts-1.7b-custom-voice"
    multilingual = true
    primary_language = "en"
    supported_languages = ["de", "en", "es", "fr", "it", "ja", "ko", "pt", "ru", "zh"]
    supported_devices = ["cpu", "gpu"]
    # 3.8 GB of weights plus the 0.7 GB codec, in bf16, with KV-cache headroom.
    estimated_vram_bytes = 6442450944
    max_input_chars = 500
    output_sample_rate = 24000
    default_voice = "ryan"
    # Preset: the voice is still one of the nine. Unlike the 0.6B checkpoint,
    # this one takes `instructions` as delivery guidance on top of the voice.
    voice_kinds = ["preset"]
    files = [
        { url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice/resolve/main/config.json", destination = "models/qwen3-tts-1.7b-custom-voice/config.json", sha256 = "17a07f527a1c25ea30b4e023a184482a23d3e279d697b1dc81b1bde498d29cf9" },
